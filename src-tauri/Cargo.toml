[package]
name = "lyricfloat"
version = "0.1.0"
description = "A lightweight floating synced-lyrics widget for Windows"
authors = ["LyricFloat contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "lyricfloat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }
